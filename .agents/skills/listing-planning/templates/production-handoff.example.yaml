production_handoff:
  project:
    market: DE
    locale: de-DE
    channel: amazon
    site: amazon.de
    category: project-defined
    product: Example Product
    offer: single
    page_target: single-listing
  page_plan:
    gallery:
      - G1
      - G2
    enhanced_content:
      - A1
    other_required_regions: []
  asset_set:
    - asset_id: G1
      role: gallery-native
      slot: G1
      primary_message: Core positioning
      evidence_mode: SOURCE_FAITHFUL
      status: READY
    - asset_id: G2
      role: gallery-native
      slot: G2
      primary_message: Mechanism proof
